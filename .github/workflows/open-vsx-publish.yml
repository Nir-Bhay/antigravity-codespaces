name: Publish to Open VSX Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ovsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Extension Syntax
        run: node -c extension.js

      - name: Run Unit Tests
        run: npm test

      - name: Install locked publishing tool
        run: npm ci --ignore-scripts

      - name: Verify locked Open VSX publisher
        run: node scripts/check-ovsx-pin.js

      - name: Package Extension (VSIX)
        run: npx @vscode/vsce package --no-git-tag-version --allow-missing-repository --skip-license

      - name: Publish to Open VSX Registry
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          ./node_modules/.bin/ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
