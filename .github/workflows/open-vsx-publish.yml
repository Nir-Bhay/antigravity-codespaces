name: Publish to Open VSX Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ovsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate Extension Syntax
        run: node -c extension.js

      - name: Run Unit Tests
        run: npm test

      - name: Package Extension (VSIX)
        run: npx @vscode/vsce package --no-git-tag-version --allow-missing-repository --skip-license

      - name: Publish to Open VSX Registry
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not set — add it in Settings → Secrets → Actions."
            exit 1
          fi
          npx ovsx publish *.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
