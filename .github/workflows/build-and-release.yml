name: Build & Release VSIX

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate VSIX
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate Extension Syntax
        run: node -c extension.js

      - name: Run Unit Tests
        run: npm test

      - name: Package Extension (VSIX)
        run: npx @vscode/vsce package --no-git-tag-version --allow-missing-repository --skip-license

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-codespaces-vsix
          path: "*.vsix"

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: antigravity-codespaces-vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
          draft: false
          prerelease: false
